plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ir.chillehyar.mahdi'
    compileSdk 36

    defaultConfig {
        applicationId 'ir.chillehyar.mahdi'
        minSdk 23
        targetSdk 35
        versionCode 42
        versionName '1.2-kotlin'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
