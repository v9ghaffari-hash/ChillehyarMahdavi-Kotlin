
name: Build Chillehyar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir -p android-project
          if [ -f "YarShodan.zip" ]; then
            unzip -q YarShodan.zip -d android-project
          elif [ -f "project.zip" ]; then
            unzip -q project.zip -d android-project
          else
            echo "ERROR: Android project ZIP not found"
            ls -la
            exit 1
          fi

      - name: Find Gradle project
        run: |
          GRADLE_FILE=$(find android-project -name gradlew -type f | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew not found in ZIP"
            find android-project -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chillehyar-APK
          path: android-project/**/*.apk
          if-no-files-found: error
