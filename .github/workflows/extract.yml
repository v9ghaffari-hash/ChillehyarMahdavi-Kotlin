
name: Extract Android Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and locate Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="ChillehyarMahdavi_Native_Kotlin_Advanced_v31.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            find . -maxdepth 2 -type f
            exit 1
          fi

          mkdir -p /tmp/chillehyar_v31
          unzip -oq "$ZIP_FILE" -d /tmp/chillehyar_v31

          SETTINGS_FILE="$(find /tmp/chillehyar_v31 \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            find /tmp/chillehyar_v31 -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Project directory: $PROJECT_DIR"
          echo "Settings file: $SETTINGS_FILE"
          ls -la "$PROJECT_DIR"

          rsync -a \
            --exclude='.git/' \
            --exclude='*.zip' \
            "$PROJECT_DIR/" ./

      - name: Check extracted project
        shell: bash
        run: |
          set -e
          test -d app
          test -f gradlew || {
            echo "WARNING: Gradle wrapper gradlew is missing."
          }
          ls -la
          ls -la app

      - name: Commit extracted project
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract native Kotlin v31 project"
            git push
          else
            echo "No changes to commit."
          fi
