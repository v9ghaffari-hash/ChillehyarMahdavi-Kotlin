name: Extract Kotlin Project

on:
  push:
    branches:
      - main
    paths:
      - 'Chillehyar_Kotlin_GitReady_v1.2.zip'
      - '.github/workflows/extract-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract project ZIP
        run: |
          set -e
          test -f Chillehyar_Kotlin_GitReady_v1.2.zip
          unzip -o Chillehyar_Kotlin_GitReady_v1.2.zip -d .
          rm -f Chillehyar_Kotlin_GitReady_v1.2.zip
          rm -f .github/workflows/build.yml

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract Kotlin Android project"
            git push
          fi
